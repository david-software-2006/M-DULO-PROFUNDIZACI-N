<!DOCTYPE html>
<html>
  <head>
    <title>Javascript práctico</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./javascript.css" />
  </head>

  <body>
    <div class="contenedor">
      <!-- <button type="button" id="boton" class="boton-efecto">Haz clic</button> -->
      <h1>¡Mundo Operativo!</h1>

      <label for="num1">Número 1:</label>

      <input type="number" id="num1" placeholder="Ingresa un número para operar" />
      <br />

      <label for="num2">Número 2:</label>
      <input type="number" id="num2" placeholder="Ingresa otro número para operar" />
      <br />
      <br>

      <label for="operacion">¿Qué operación deseas hacer?:</label>
      <select id="operacion">
        <option value="sumar">Sumar</option>
        <option value="restar">Restar</option>
        <option value="multiplicar">Multiplicar</option>
        <option value="dividir">Dividir</option>
        <option value="modulo">Residuo</option>
        <option value="raiz">Raíz Cuadrada</option>
        <option value="absoluto">Valor Absoluto</option>
      </select>   

      <br /><br />
      
      <button id="calcular" class="boton-efecto">Calcular</button>
      <h2>Resultado: <span id="resultado">0</span></h2>
    </div>
    <script src="./javascript.js"></script>
  </body>
</html>
