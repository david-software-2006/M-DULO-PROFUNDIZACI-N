<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick & Morty Battles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Rick & Morty Battles</h1>
        
        <div id="card-container" class="card-container"></div>

        <button id="fight" class="btn btn-fight">Battle</button>

        <div class="columns-container">
            <div class="column dislike-column" id="dislike-zone">
                <h2>Disliked Characters</h2>
                <ul id="disliked-list"></ul>
            </div>

            <div class="column like-column" id="like-zone">
                <h2>Liked Characters</h2>
                <ul id="liked-list"></ul>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
